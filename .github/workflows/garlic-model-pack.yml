name: Build Garlic Qwen3.5 0.8B model pack

on:
  push:
    branches: [feature/matrix-ai-core]
    paths:
      - "native/garlic_android/build_qwen35_model_pack.py"
      - ".github/workflows/android.yml"
      - "third_party/garlic-llm/pc/q4.py"
      - "third_party/garlic-llm/pc/export_chat.py"
      - "third_party/garlic-llm/pc/gpu.py"
      - ".github/workflows/garlic-model-pack.yml"
  workflow_dispatch:
    inputs:
      model:
        description: Official Qwen model repository
        required: true
        default: Qwen/Qwen3.5-0.8B

permissions:
  contents: read

jobs:
  build-model-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out MATRIX and retained Garlic converters
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install model conversion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" safetensors huggingface_hub
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Convert official Qwen weights to Garlic Q4i format
        env:
          MATRIX_QWEN_MODEL: ${{ inputs.model || 'Qwen/Qwen3.5-0.8B' }}
          MATRIX_MODEL_OUTPUT: ${{ github.workspace }}/build/matrix-qwen35-0.8b
          MATRIX_MODEL_WORK: ${{ github.workspace }}/build/qwen35-work
        run: python native/garlic_android/build_qwen35_model_pack.py

      - name: Upload the Garlic model pack
        uses: actions/upload-artifact@v4
        with:
          name: matrix-garlic-qwen35-0.8b-q4i
          path: build/matrix-qwen35-0.8b/
          if-no-files-found: error
          retention-days: 30
