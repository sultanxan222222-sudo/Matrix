name: Android CI
on:
  push:
    branches: [main, 'feature/vaynax-hybrid-free-node-pool', 'feature/openvpn3-embedded-engine']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # OpenVPN 3 Core and Asio are pinned to the audited upstream commit.
      # Recursive checkout is required because the upstream project pins both as submodules.
      - uses: actions/checkout@v4
        with:
          repository: networks-rs/openvpn-connect-rs
          ref: 98fcf3ba0abfddb9f2458daace5ab2182052054b
          path: third_party/openvpn-connect-rs
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 5 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK and NDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake ninja-build zip

      - name: Configure Android NDK environment
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build embedded OpenVPN 3 Core for ARM64
        env:
          ANDROID_PLATFORM: android-26
        run: |
          set -euxo pipefail
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android26-clang"
          export CXX_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android26-clang++"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          export RANLIB_aarch64_linux_android="$TOOLCHAIN/llvm-ranlib"
          export CMAKE_GENERATOR=Ninja
          cargo build --release --target aarch64-linux-android --manifest-path native/openvpn-jni/Cargo.toml
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp native/openvpn-jni/target/aarch64-linux-android/release/libmatrix_openvpn.so app/src/main/jniLibs/arm64-v8a/libmatrix_openvpn.so

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build and run unit tests
        run: gradle testDebugUnitTest assembleDebug

      - name: Verify embedded OpenVPN native library is packaged
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libmatrix_openvpn.so'

      - name: Package MATRIX source with pinned OpenVPN 3 sources
        run: |
          zip -qr matrix-vpn-source.zip app native docs .github build.gradle.kts settings.gradle.kts gradle.properties third_party/openvpn-connect-rs

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: matrix-vpn-openvpn3-arm64-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: matrix-vpn-openvpn3-source
          path: matrix-vpn-source.zip
          if-no-files-found: error
          retention-days: 14
