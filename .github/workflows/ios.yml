name: iOS parallel evaluation
on:
  push:
    branches: [ios/parallel-evaluation]
  pull_request:
    branches: [fix/import-and-free-vpn-discovery]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: matrix-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app-shell:
    name: Track 1 — native SwiftUI app and embedded tunnel
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Compile app and packet tunnel for iPhone
        working-directory: ios
        run: xcodebuild -project MATRIX.xcodeproj -scheme MATRIX -sdk iphoneos -destination 'generic/platform=iOS' -configuration Debug CODE_SIGNING_ALLOWED=NO build

  tunnel-extension:
    name: Track 2 — AmneziaWG-backed packet tunnel
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Compile packet tunnel for iPhone
        working-directory: ios
        run: xcodebuild -project MATRIX.xcodeproj -scheme MATRIX -sdk iphoneos -destination 'generic/platform=iOS' -configuration Debug CODE_SIGNING_ALLOWED=NO build

  shared-core-tests:
    name: Track 3 — shared profile parsing and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Compile shared core tests for simulator
        working-directory: ios
        run: xcodebuild -project MATRIX.xcodeproj -target MATRIXCoreTests -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build

  amnezia-engine-build:
    name: Track 4 — AmneziaWG Apple engine build proof
    runs-on: macos-15
    steps:
      - name: Check out pinned AmneziaWG Apple engine
        uses: actions/checkout@v4
        with:
          repository: amnezia-vpn/amneziawg-apple
          ref: 9d5ee60edefa95b933a738dd7cda671dd18021fc
          path: vendor/amneziawg-apple
      - name: Install Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Build iOS arm64 tunnel backend
        working-directory: vendor/amneziawg-apple/Sources/WireGuardKitGo
        run: |
          make build PLATFORM_NAME=iphoneos ARCHS=arm64 SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)" CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/engine-out" CONFIGURATION_TEMP_DIR="$RUNNER_TEMP/amneziawg-build"
          test -s "$GITHUB_WORKSPACE/engine-out/libwg-go.a"
          file "$GITHUB_WORKSPACE/engine-out/libwg-go.a"
