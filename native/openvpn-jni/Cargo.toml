[package]
name = "matrix-openvpn-jni"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21.1"
openvpn-connect = { path = "../../third_party/openvpn-connect-rs/openvpn-connect", default-features = false, features = ["vendor"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
