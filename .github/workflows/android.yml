name: Android CI
concurrency:
  group: matrix-android-${{ github.run_id }}
  cancel-in-progress: false
on:
  push:
    branches: [main, 'feature/vaynax-hybrid-free-node-pool', 'feature/openvpn3-embedded-engine', 'ui/matrix-globe-glass-traffic', 'feature/matrix-ai-core', 'feature/matrix-ai-from-globe']
  pull_request:
    branches: [main, 'feature/openvpn3-embedded-engine', 'feature/matrix-ai-core', 'feature/matrix-ai-from-globe']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # OpenVPN 3 Core and Asio are pinned to the audited upstream commit.
      # Recursive checkout is required because the upstream project pins both as submodules.
      - uses: actions/checkout@v4
        with:
          repository: networks-rs/openvpn-connect-rs
          ref: 98fcf3ba0abfddb9f2458daace5ab2182052054b
          path: third_party/openvpn-connect-rs
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 5 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK and NDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake ninja-build zip

      - name: Configure Android NDK environment
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build Garlic Qwen3.5 OpenCL-on-Vulkan runtime for ARM64
        env:
          GARLIC_BUILD_JOBS: "2"
        run: |
          set -euxo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash native/garlic_android/build_garlic_android.sh

      # Build the official Qwen3.5 checkpoint into Garlic's native Q4i format
      # and bundle the complete model into this single APK.
      # Pin a Python ABI with published CPU wheels. The ubuntu-latest image
      # moved to a newer system Python, for which the old torch 2.6.0 wheel
      # is unavailable from the CPU index.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Build and bundle Garlic Qwen3.5 model weights
        env:
          MATRIX_QWEN_MODEL: Qwen/Qwen3.5-0.8B
          MATRIX_MODEL_OUTPUT: ${{ github.workspace }}/build/matrix-qwen35-0.8b
          MATRIX_MODEL_WORK: ${{ runner.temp }}/qwen35-work
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" safetensors huggingface_hub
          python -m pip install "torch==2.9.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          python native/garlic_android/build_qwen35_model_pack.py
          # Verify every generated model-pack file before it enters the APK.
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path("build/matrix-qwen35-0.8b")
          manifest = json.loads((root / "SHA256SUMS.json").read_text())
          required = {
              "model.idx", "tokenizer.bin", "qwen3.5-0.8b-q4i.bin",
              "qwen3.5-0.8b-q4i.json", "QWEN-LICENSE", "MODEL-INFO.txt",
          }
          missing = required - manifest.keys()
          if missing:
              raise SystemExit(f"Model pack manifest is missing: {sorted(missing)}")
          for name, entry in manifest.items():
              file = root / name
              if not file.is_file():
                  raise SystemExit(f"Model pack file is missing: {name}")
              digest = hashlib.sha256(file.read_bytes()).hexdigest()
              if digest != entry.get("sha256") or file.stat().st_size != entry.get("size"):
                  raise SystemExit(f"Model pack checksum/size mismatch: {name}")
          print(f"Verified {len(manifest)} model-pack files.")
          PY
          mkdir -p app/src/main/assets/garlic
          cp build/matrix-qwen35-0.8b/model.idx app/src/main/assets/garlic/model.idx
          cp build/matrix-qwen35-0.8b/tokenizer.bin app/src/main/assets/garlic/tokenizer.bin
          cp build/matrix-qwen35-0.8b/qwen3.5-0.8b-q4i.bin app/src/main/assets/garlic/qwen3.5-0.8b-q4i.bin
          cp build/matrix-qwen35-0.8b/qwen3.5-0.8b-q4i.json app/src/main/assets/garlic/qwen3.5-0.8b-q4i.json
          cp build/matrix-qwen35-0.8b/QWEN-LICENSE app/src/main/assets/garlic/QWEN-LICENSE
          cp build/matrix-qwen35-0.8b/MODEL-INFO.txt app/src/main/assets/garlic/MODEL-INFO.txt
          cp build/matrix-qwen35-0.8b/SHA256SUMS.json app/src/main/assets/garlic/SHA256SUMS.json
          test -s app/src/main/assets/garlic/model.idx
          test -s app/src/main/assets/garlic/tokenizer.bin
          test -s app/src/main/assets/garlic/qwen3.5-0.8b-q4i.bin
          test -s app/src/main/assets/garlic/QWEN-LICENSE
          test -s app/src/main/assets/garlic/SHA256SUMS.json

      - name: Build embedded OpenVPN 3 Core for ARM64
        env:
          ANDROID_PLATFORM: android-26
        run: |
          set -euxo pipefail
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android26-clang"
          export CXX_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android26-clang++"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          export RANLIB_aarch64_linux_android="$TOOLCHAIN/llvm-ranlib"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--target=aarch64-linux-android26 --sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export CMAKE_GENERATOR=Ninja
          cargo build --release --target aarch64-linux-android --manifest-path native/openvpn-jni/Cargo.toml
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp native/openvpn-jni/target/aarch64-linux-android/release/libmatrix_openvpn.so app/src/main/jniLibs/arm64-v8a/libmatrix_openvpn.so

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build and run unit tests
        run: gradle testDebugUnitTest assembleDebug

      - name: Verify embedded OpenVPN native library is packaged
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libmatrix_openvpn.so'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libmatrix_garlic.so'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libOpenCL.so'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/garlic/qwen35.spv'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/garlic/model.idx'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/garlic/tokenizer.bin'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/garlic/qwen3.5-0.8b-q4i.bin'

      - name: Package MATRIX source with pinned OpenVPN 3 sources
        run: |
          zip -qr matrix-vpn-source.zip app native docs .github build.gradle.kts settings.gradle.kts gradle.properties third_party/openvpn-connect-rs third_party/garlic-llm

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: matrix-vpn-0.8.2-full-ai-arm64-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: matrix-vpn-0.8.2-full-ai-source
          path: matrix-vpn-source.zip
          if-no-files-found: error
          retention-days: 14
