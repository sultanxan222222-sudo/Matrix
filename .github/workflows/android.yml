name: Android CI
on:
  push:
    branches: [main, feature/matrix-ai-core]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build and run unit tests
        run: gradle testDebugUnitTest assembleDebug
      # Feature branches compile and test continuously, but do not publish
      # interim APKs. Only the main branch publishes a downloadable artifact.
      - name: Upload release-candidate debug APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: matrix-vpn-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
